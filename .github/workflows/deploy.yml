name: Build & Deploy

# Каждый push проверяется и публикуется на Cloudflare Pages (проект ekbgame):
#   main            → https://ekbgame.pages.dev/
#   любая другая    → https://<ветка>.ekbgame.pages.dev/
# Точные адреса выводятся в сводке запуска (Summary).
# Нужны секреты репозитория CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID (см. docs/ARCHITECTURE.md).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_PROJECT: ekbgame
  WRANGLER: npx --yes wrangler@4.156.0

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Проверки (формат, типы, тесты)
        run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Проверка секретов Cloudflare
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "### ⚠️ Публикация пропущена: не заданы секреты CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: dist
          path: dist
      - name: Создать проект Cloudflare Pages (если ещё нет)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if ! $WRANGLER pages project list | grep -qw "$CF_PROJECT"; then
            $WRANGLER pages project create "$CF_PROJECT" --production-branch main
          fi
      - name: Публикация
        if: steps.secrets.outputs.ready == 'true'
        run: |
          $WRANGLER pages deploy dist \
            --project-name "$CF_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true | tee deploy.log
          {
            echo "### 🚀 Опубликовано ($GITHUB_REF_NAME)"
            grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
