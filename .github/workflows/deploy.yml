name: Build & Deploy

# Каждый push проверяется и публикуется на GitHub Pages:
#   main            → https://alexkof.github.io/ekbgame/
#   любая другая    → https://alexkof.github.io/ekbgame/preview/<ветка>/
# При удалении ветки её превью удаляется.
on:
  push:
    branches: ['**', '!gh-pages']
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Проверки (формат, типы, тесты)
        run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Публикации идут строго по очереди, чтобы не было гонок при пуше в gh-pages.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Публикация в gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/publish-pages.sh deploy "$RUNNER_TEMP/dist" "$GITHUB_REF_NAME"
      - name: Ссылка
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            URL="https://$OWNER.github.io/$REPO/"
          else
            SLUG=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')
            URL="https://$OWNER.github.io/$REPO/preview/$SLUG/"
          fi
          echo "### 🚀 Опубликовано: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"

  cleanup-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/publish-pages.sh remove "$DELETED_BRANCH"
